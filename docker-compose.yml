version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-redline}:${POSTGRES_PASSWORD:-redline_pass}@db:5432/${POSTGRES_DB:-redline_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-default-secret-key-for-docker}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-redline}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-redline_pass}
      - POSTGRES_DB=${POSTGRES_DB:-redline_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline -d redline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
